# 生产形态：app（多阶段构建镜像）+ postgres + redis —— 见 ADR 0002
# 反向代理不在 compose 内：由宿主机既有 Caddy 指向 ${APP_PORT}
# 用法：docker compose up -d --build
# 演示数据（可选，一次性任务）：docker compose run --rm seed
name: xinhuo-prod

# 容器日志轮转：防止长期运行把宿主机磁盘写满
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    image: xinhuo-ich:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-xinhuo}:${POSTGRES_PASSWORD:-xinhuo}@postgres:5432/${POSTGRES_DB:-xinhuo}
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:18.2-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xinhuo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xinhuo}
      POSTGRES_DB: ${POSTGRES_DB:-xinhuo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xinhuo} -d ${POSTGRES_DB:-xinhuo}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8.4-alpine
    restart: unless-stopped
    logging: *default-logging
    # AOF 持久化：会话存 Redis，重启不掉登录态
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # 一次性演示数据任务（不随 up 启动，仅演示部署需要）：
  # 复用多阶段构建的 build 层（与应用镜像共享缓存，不额外占构建时间），
  # 内容种子 + 演示学习者 + 合成行为事件 + 画像重建，见 prisma/demo-seed.ts
  seed:
    build:
      context: .
      target: build
    profiles: ["tools"]
    restart: "no"
    command: ["pnpm", "demo:seed"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-xinhuo}:${POSTGRES_PASSWORD:-xinhuo}@postgres:5432/${POSTGRES_DB:-xinhuo}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
