# 开发环境：仅基础设施（PostgreSQL + Redis），应用在宿主机热载（pnpm dev）—— 见 ADR 0002
# 用法：docker compose -f compose.dev.yaml up -d
name: xinhuo-dev

services:
  postgres:
    image: postgres:18.2-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xinhuo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xinhuo}
      POSTGRES_DB: ${POSTGRES_DB:-xinhuo}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xinhuo} -d ${POSTGRES_DB:-xinhuo}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8.4-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_dev_data:
  redis_dev_data:
